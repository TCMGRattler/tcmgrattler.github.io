<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 The Rattler</title>
<style>
:root{--bg:#f3f5f8;--ink:#0f172a;--muted:#64748b;--navy:#111827;--orange:#f26522;--green:#16a34a;--line:#e5e7eb;--gold:#facc15;--silver:#d1d5db;--bronze:#b45309;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);padding-bottom:78px}.app{max-width:520px;margin:0 auto}.hero{background:linear-gradient(135deg,#111827,#263348 70%,#f26522);color:#fff;text-align:center;padding:22px 18px 18px;border-radius:0 0 28px 28px;box-shadow:0 12px 30px rgba(17,24,39,.2)}


.hero h1{margin:0;font-size:38px;letter-spacing:-.05em;line-height:.96}


.hero{
  position:relative;
}

.hero-logo{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  width:105px;
  height:auto;
}

.hero-center{
  text-align:center;
}

.hero .sub{font-weight:750;margin-top:8px}.hero .date{font-size:13px;opacity:.82;margin-top:3px}.last-updated{margin-top:8px;font-size:12px;font-weight:800;opacity:.86}.screen{display:none;padding:14px}.screen.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 8px 24px rgba(15,23,42,.06);margin-bottom:12px}.shootout{background:#111827;color:#fff}.shootout .title{font-size:16px;font-weight:950;margin-bottom:8px}.shoot-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shoot-item{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px}.shoot-label{font-size:10px;color:#cbd5e1;text-transform:uppercase;font-weight:900}.shoot-value{font-size:18px;font-weight:950;margin-top:2px}.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi .label{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase}.kpi .value{font-size:25px;font-weight:950}.top-flight-value{font-size:22px!important;line-height:1.05!important;white-space:nowrap!important;letter-spacing:-.03em!important}.control-stack{display:grid;gap:8px;margin-bottom:12px}select,.pill-btn{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:14px;background:#fff;font-weight:800;color:#111827}.section-title{font-size:18px;font-weight:950;margin:10px 2px}.flight-card h2{display:flex;justify-content:space-between;align-items:center;margin:0;font-size:20px}.flight-total{color:var(--orange);font-weight:950}.bar{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:linear-gradient(90deg,#f26522,#2563eb)}.flight-col-head,.team-row{display:grid;grid-template-columns:52px minmax(220px,1fr) 70px 110px!important;column-gap:8px!important;align-items:center}.flight-col-head{padding:6px 0 4px;font-size:11px;font-weight:950;color:#64748b;border-bottom:1px solid #e5e7eb;margin-bottom:4px}.team-row{padding:9px 0;border-bottom:1px solid #eef2f7}.team-row:last-child{border-bottom:0}.member{font-weight:950;font-size:13px;line-height:1.15}.guest,.owner{font-size:11px;color:var(--muted);line-height:1.2}.bid{font-weight:950;color:var(--red);text-align:right}.owner-col{font-size:12px;color:#334155;font-weight:950;line-height:1.2;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hcp-col{font-size:13px;font-weight:950;color:#0f766e;text-align:left;white-space:nowrap}.player-hcp{font-size:11px;font-weight:900;color:#64748b;margin-left:4px;white-space:nowrap}.winner-section{margin-top:12px;border-radius:16px;padding:12px}.fw{background:#eff6ff;border:1px solid #bfdbfe}.dm{background:#f0fdf4;border:1px solid #bbf7d0}.winner-head{font-weight:950;margin-bottom:8px}.winner-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin-top:8px}.winner-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.rank{font-size:11px;font-weight:950;border-radius:999px;padding:4px 8px;display:inline-block}.gold{background:var(--gold)}.silver{background:var(--silver)}.bronze{background:var(--bronze);color:#fff}.winner-name{font-weight:950;margin-top:7px;line-height:1.15}.amount{font-weight:950;color:#166534;background:#dcfce7;border-radius:999px;padding:5px 9px;white-space:nowrap}.day-block{margin-top:10px}.day-title{font-weight:950;color:#166534;margin:12px 2px 5px}.team-directory{display:grid;gap:10px}.team-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.team-card-grid{display:grid;grid-template-columns:44px 56px minmax(0,1fr) auto;gap:9px;align-items:start}.team-number-pill{background:#e0f2fe;color:#075985;border-radius:999px;font-size:11px;font-weight:950;padding:5px 8px;text-align:center}.team-hcp-pill{background:#ccfbf1;color:#0f766e;border-radius:999px;font-size:12px;font-weight:950;padding:5px 8px;text-align:center;white-space:nowrap}.team-card-bid{font-weight:950;color:#16a34a;background:#dcfce7;border-radius:999px;padding:5px 9px;white-space:nowrap}.team-player-line{font-size:14px;font-weight:950;color:#0f172a;line-height:1.15}.team-player-line+.team-player-line{margin-top:4px}.team-person-hcp{font-size:11px;font-weight:900;color:#64748b;margin-left:4px}.team-owner-line{grid-column:3/5;font-size:14px;color:#334155;font-weight:950;margin-top:5px}.team-owner-line b{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em}.team-count-note,.team-selected-note,.owner-payout-control-note,.owner-summary-count{font-size:12px;color:#64748b;margin:0 2px 10px}.team-sort-label{font-size:11px;text-transform:uppercase;font-weight:950;color:#64748b;margin:2px 2px -4px}.team-awards{margin-top:11px;border-top:1px solid #e5e7eb;padding-top:9px}.team-awards-title{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:950;color:#111827;margin-bottom:6px}.team-award-pill{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:9px;margin-top:7px}.team-award-type{font-size:12px;font-weight:950;color:#9a3412}.team-award-detail{font-size:12px;color:#334155;margin-top:2px}.team-award-amount{font-size:14px;font-weight:950;color:#fff;background:#16a34a;border-radius:999px;padding:5px 10px;white-space:nowrap}.team-award-empty{font-size:12px;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:9px;margin-top:7px}.team-payout-total-badge{background:#dcfce7;color:#166534;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:950;white-space:nowrap}.owner-summary{background:linear-gradient(135deg,#16a34a,#14532d);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.owner-summary .big{font-size:34px;font-weight:950;display:block}.owner-bid-line{margin-top:10px;background:#fff;color:#111827;border:1px solid #111827;border-radius:12px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:950}.owner-bid-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#111827!important}.owner-bid-val{font-size:16px;color:#111827!important;white-space:nowrap}.owner-payout-line{margin-top:8px;color:#fff;font-weight:850}.owner-team-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.team-meta{display:flex;justify-content:space-between;color:#075985;font-size:12px;font-weight:950;margin-bottom:8px}.summary-list,.owner-list{display:grid;gap:10px}.summary-card{background:#fff;border:1px solid #d1fae5;border-radius:18px;padding:14px;margin-bottom:10px}.summary-card.has{background:linear-gradient(180deg,#ecfdf5,#fff);border-color:#86efac}.summary-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.summary-name{font-weight:950}.summary-total{font-size:23px;color:#16a34a;font-weight:950;white-space:nowrap}.summary-break{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:9px}.mini-label{font-size:10px;color:var(--muted);font-weight:950;text-transform:uppercase}.mini-val{font-size:15px;font-weight:950;margin-top:2px}.bid-total-mini{grid-column:1/-1!important;background:#fff!important;border-color:#111827!important;color:#111827!important;display:flex!important;justify-content:space-between!important;align-items:center!important;gap:12px!important}.bid-total-label,.bid-total-val{color:#111827!important}.bid-total-label{font-size:11px!important;font-weight:950!important;text-transform:uppercase!important;letter-spacing:.04em!important}.bid-total-val{font-size:16px!important;font-weight:950!important}.summary-entry{display:flex;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:8px;margin-top:7px;font-size:12px}.award-title{font-weight:950;color:#9a3412;font-size:12px}.award-detail{color:#334155;font-size:12px}.award-amt{background:#16a34a;color:#fff;border-radius:999px;padding:5px 10px;font-weight:950}.owners-merged-divider{height:1px;background:#e5e7eb;margin:16px 0}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;box-shadow:0 -10px 24px rgba(15,23,42,.08);display:flex;justify-content:center;z-index:10}.bottom-nav .inner{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:0}.nav-btn{border:0;background:#fff;padding:10px 4px 12px;color:#64748b;font-weight:850;font-size:11px}.nav-btn.active{color:#f26522}.nav-ico{display:block;font-size:19px;margin-bottom:2px}.button-row{display:flex;gap:10px;margin:18px 14px}.button-row button{flex:1;border:0;background:#2563eb;color:white;border-radius:14px;padding:12px;font-weight:900}.button-row .secondary{background:#111827}


@media(min-width:760px){.app{max-width:1120px}.hero{border-radius:0 0 34px 34px}.screen{padding:20px}.flight-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px}.summary-list{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.owner-list{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.bottom-nav .inner{max-width:780px}.nav-btn{font-size:12px}}


@media(max-width:480px){

  .hero{
    padding:12px 14px 18px!important;
  }

  .hero h1{
    font-size:24px!important;
    line-height:1.05!important;
  }

  .hero-logo{
    width:65px!important;
    left:10px!important;
  }

}



{.hero{padding:12px 14px 18px!important}.hero h1{font-size:24px!important;line-height:1.05!important}.screen{padding:10px!important}.flight-list{display:flex!important;flex-direction:column!important;gap:10px!important}.flight-card{margin-bottom:0!important;border-radius:16px!important}.flight-col-head,.team-row{grid-template-columns:minmax(140px,1fr) 52px 68px 90px!important;column-gap:4px!important}.owner-col{font-size:11px}.top-flight-value{font-size:18px!important}}
</style>
</head>
<body>
<div class="app">

<header class="hero">

  <img
    src="rattler-logo.jpg"
    alt="The Rattler Logo"
    class="hero-logo">

  <div class="hero-center">

<h1>The Rattler</h1>
<div class="sub">Twin Creeks Member Guest</div>

    <div class="date">
      September 9-12, 2026
    </div>

    <div
      id="lastUpdated"
      class="last-updated">
    </div>

  </div>

</header>





<main><section id="home" class="screen active"></section><section id="teams" class="screen"></section><section id="owners" class="screen"></section></main>
</div>
<nav class="bottom-nav"><div class="inner"><button class="nav-btn active" data-screen="home" onclick="showScreen('home')"><span class="nav-ico">⌂</span>Home</button><button class="nav-btn" data-screen="teams" onclick="showScreen('teams')"><span class="nav-ico">☷</span>Teams</button><button class="nav-btn" data-screen="owners" onclick="showScreen('owners')"><span class="nav-ico">◎</span>Owners</button></div></nav>





<script src="data.js"></script>

<script>







function money(n){return typeof n==='number'?n.toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0}):(n||'')}
function cleanVal(v){let s=String(v??'').trim();return (s===''||s==='0'||s==='#N/A')?'TBD':s}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function placeLabel(p){let s=String(p||'');if(s==='1')return '1st';if(s==='2')return '2nd';if(s==='3')return '3rd';return s}
function badge(place){let p=placeLabel(place);return p.includes('1st')?'<span class="rank gold">1ST</span>':p.includes('2nd')?'<span class="rank silver">2ND</span>':'<span class="rank bronze">3RD</span>'}
function updateLastUpdated(){let el=document.getElementById('lastUpdated');if(el)el.textContent=DATA.lastUpdated?'Last Updated: '+new Date(DATA.lastUpdated).toLocaleString():'Last Updated: '+new Date().toLocaleString()}
function renderCurrentScreen(){if(document.getElementById('home').classList.contains('active'))renderHome();if(document.getElementById('teams').classList.contains('active'))renderTeamsPage();if(document.getElementById('owners').classList.contains('active'))renderOwners();updateLastUpdated()}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));renderCurrentScreen();window.scrollTo({top:0,behavior:'smooth'})}
function renderHome(){let s=DATA.summary||{},sh=DATA.shootout||{};document.getElementById('home').innerHTML=`<div class="card shootout"><div class="title">Shoot Out Bonus Pool</div><div class="shoot-grid"><div class="shoot-item"><div class="shoot-label">Bonus Pool</div><div class="shoot-value">${money(+sh.bonusPool||0)}</div></div><div class="shoot-item"><div class="shoot-label">1st</div><div class="shoot-value">${money(+sh.firstPlace||0)}</div></div><div class="shoot-item"><div class="shoot-label">2nd</div><div class="shoot-value">${money(+sh.secondPlace||0)}</div></div><div class="shoot-item"><div class="shoot-label">3rd</div><div class="shoot-value">${money(+sh.thirdPlace||0)}</div></div></div></div><div class="kpi-grid"><div class="card kpi"><div class="label">Flights</div><div class="value">${s.flightCount||0}</div></div><div class="card kpi"><div class="label">Teams</div><div class="value">${s.teamCount||0}</div></div><div class="card kpi"><div class="label">Avg Bid</div><div class="value">${money(+s.avgBid||0)}</div></div><div class="card kpi"><div class="label">Top Flight</div><div class="value top-flight-value">#${s.topFlight||0} • ${money(+s.topFlightTotal||0)}</div></div></div><div class="section-title">Flights</div><div class="control-stack"><select id="homeFlightSel" onchange="renderHomeFlights()"><option value="">All Flights</option>${DATA.flights.map(f=>`<option value="${f.flight}">Flight #${f.flight}</option>`).join('')}</select><select id="homeSortSel" onchange="renderHomeFlights()"><option value="flightAsc">Flight # ↑</option><option value="flightDesc">Flight # ↓</option><option value="bidHigh">Total Bid High → Low</option><option value="bidLow">Total Bid Low → High</option></select></div><div id="homeFlightList" class="flight-list"></div>`;renderHomeFlights()}
function renderHomeFlights(){let fs=document.getElementById('homeFlightSel')?.value||'',sort=document.getElementById('homeSortSel')?.value||'flightAsc';let max=Math.max(1,...DATA.flights.map(f=>+f.total||0));let filtered=DATA.flights.filter(f=>!fs||String(f.flight)===fs);filtered.sort((a,b)=>sort==='flightDesc'?b.flight-a.flight:sort==='bidHigh'?b.total-a.total:sort==='bidLow'?a.total-b.total:a.flight-b.flight);document.getElementById('homeFlightList').innerHTML=filtered.map(f=>flightCard(f,max)).join('')}
function flightCard(f,max){return `<article class="card flight-card"><h2><span>Flight #${f.flight}</span><span class="flight-total">${money(+f.total||0)}</span></h2><div class="bar"><span style="width:${Math.max(4,Math.round((+f.total||0)/max*100))}%"></span></div><div class="flight-col-head"><span>HDCP</span><span>Team</span><span>Bid</span><span>Owner</span></div>${(f.teams||[]).map(t=>`<div class="team-row"><div class="hcp-col">${esc(t.team_hcp||'TBD')}</div><div><div class="member">${esc(t.member)} <span class="player-hcp">(${esc(t.member_hcp||'TBD')})</span></div><div class="guest">${esc(t.guest)} <span class="player-hcp">(${esc(t.guest_hcp||'TBD')})</span></div></div><div class="bid">${money(+t.bid||0)}</div><div class="owner-col">${esc(t.owner)}</div></div>`).join('')}<section class="winner-section fw"><div class="winner-head">Flight Winners</div>${(f.flight_winners||[]).map(w=>`<div class="winner-card"><div class="winner-top"><div>${badge(w.place)} ${esc(placeLabel(w.place))}</div><div class="amount">${money(+w.amount||0)}</div></div><div class="winner-name">${esc(cleanVal(w.winner))}</div><div class="owner">Owner: ${esc(cleanVal(w.owner))}</div></div>`).join('')}</section><section class="winner-section dm"><div class="winner-head">Day Money</div>${['Thursday','Friday','Saturday'].map(day=>{let e=(f.day_money||[]).filter(x=>x.day===day);return `<div class="day-block"><div class="day-title">${day}</div>${e.length?e.map(w=>`<div class="winner-card"><div class="winner-top"><div>${badge(w.place)} ${esc(placeLabel(w.place))}</div><div class="amount">${money(+w.amount||0)}</div></div><div class="winner-name">${esc(cleanVal(w.winner))}</div><div class="owner">Owner: ${esc(cleanVal(w.owner))}</div></div>`).join(''):'<div class="winner-card"><div class="winner-name">TBD</div><div class="guest">No payout listed.</div></div>'}</div>`}).join('')}</section></article>`}
function allTeamsFlat(){let rows=[];DATA.flights.forEach(f=>(f.teams||[]).forEach(t=>rows.push({...t,flight:f.flight,flightTotal:f.total,key:`${f.flight}-${t.team}`,awards:teamAwards(f,t)})));return rows}
function teamAwards(f,t){return [...(f.flight_winners||[]),...(f.day_money||[])].filter(a=>cleanVal(a.owner)===t.owner&&(cleanVal(a.winner)===t.member||cleanVal(a.winner)===t.guest))}
function teamsByMemberAZ(){return [...allTeamsFlat()].sort((a,b)=>String(a.member).localeCompare(String(b.member))||String(a.guest).localeCompare(String(b.guest))||a.flight-b.flight||a.team-b.team)}
function teamAwardAmountTotal(t){return (t.awards||[]).reduce((s,a)=>s+(+a.amount||0),0)}
function renderTeamAward(a){return `<div class="team-award-pill"><div><div class="team-award-type">${esc(a.type)}</div><div class="team-award-detail">${a.day?esc(a.day)+' · ':''}${esc(placeLabel(a.place))} · ${esc(cleanVal(a.winner))}</div></div><div class="team-award-amount">${money(+a.amount||0)}</div></div>`}
function renderTeamAwards(t,selected){if(!selected)return '';let total=teamAwardAmountTotal(t);return `<div class="team-awards"><div class="team-awards-title"><span>Team Results</span><span class="team-payout-total-badge">${money(total)}</span></div>${t.awards&&t.awards.length?t.awards.map(renderTeamAward).join(''):'<div class="team-award-empty">No Flight Winner or Day Money payout listed for this team.</div>'}</div>`}
function renderTeamsPage(){let lookupTeams=teamsByMemberAZ();document.getElementById('teams').innerHTML=`<div class="section-title">Teams</div><div class="control-stack"><div class="team-sort-label">Team Lookup: Member / Guest</div><select id="teamLookup" onchange="renderTeamList()"><option value="">All Teams</option>${lookupTeams.map(t=>`<option value="${esc(t.key)}">${esc(t.member)} / ${esc(t.guest)}</option>`).join('')}</select></div><div id="teamCount" class="team-count-note"></div><div id="teamSelectedNote" class="team-selected-note"></div><div id="teamList" class="team-directory"></div>`;renderTeamList()}
function renderTeamCard(t,selected){return `<article class="team-card"><div class="team-card-grid"><div class="team-number-pill">${t.team}</div><div class="team-hcp-pill">${esc(t.team_hcp||'TBD')}</div><div><div class="team-player-line">${esc(t.member)} <span class="team-person-hcp">(${esc(t.member_hcp||'TBD')})</span></div><div class="team-player-line">${esc(t.guest)} <span class="team-person-hcp">(${esc(t.guest_hcp||'TBD')})</span></div></div><div class="team-card-bid">${money(+t.bid||0)}</div><div class="team-owner-line"><b>Owner</b> ${esc(t.owner)}</div></div>${renderTeamAwards(t,selected)}</article>`}
function renderTeamList(){let all=allTeamsFlat();let sel=document.getElementById('teamLookup')?.value||'';let selected=sel!=='';let rows=selected?all.filter(t=>t.key===sel):[];document.getElementById('teamCount').textContent=selected?`${rows.length} team${rows.length===1?'':'s'} shown`:'Select a team to view details';document.getElementById('teamSelectedNote').textContent=selected?'Selected team results include Flight Winner and Day Money placement details where listed.':'Choose a team from Team Lookup to display results.';document.getElementById('teamList').innerHTML=selected?rows.map(t=>renderTeamCard(t,true)).join(''):'<div class="team-count-note">No team selected.</div>'}
function ownerNames(){let s=new Set();DATA.flights.forEach(f=>(f.teams||[]).forEach(t=>s.add(t.owner)));return [...s].sort((a,b)=>String(a).localeCompare(String(b)))}
function entriesByOwner(){let e={};DATA.flights.forEach(f=>[...(f.flight_winners||[]),...(f.day_money||[])].forEach(a=>{let owner=cleanVal(a.owner);if(owner&&owner!=='TBD'){(e[owner]??=[]).push({...a,owner,flight:f.flight})}}));return e}
function ownerTeams(owner){let r=[];DATA.flights.forEach(f=>(f.teams||[]).forEach(t=>{if(t.owner===owner)r.push({...t,flight:f.flight,awards:teamAwards(f,t)})}));return r}
function ownerSummaryRows(){let e=entriesByOwner(),counts={};DATA.flights.forEach(f=>(f.teams||[]).forEach(t=>counts[t.owner]=(counts[t.owner]||0)+1));let owners=new Set([...Object.keys(e),...Object.keys(counts)]);return [...owners].map(owner=>{let entries=e[owner]||[];let total=entries.reduce((s,a)=>s+(+a.amount||0),0);let flight=entries.filter(a=>a.type==='Flight Winner').reduce((s,a)=>s+(+a.amount||0),0);let day=entries.filter(a=>a.type==='Day Money').reduce((s,a)=>s+(+a.amount||0),0);let bidTotal=DATA.flights.reduce((s,f)=>s+(f.teams||[]).filter(t=>t.owner===owner).reduce((x,t)=>x+(+t.bid||0),0),0);return {owner,total,flight,day,bidTotal,entries,teamCount:counts[owner]||0}}).sort((a,b)=>b.total-a.total||String(a.owner).localeCompare(String(b.owner)))}
function sortOwnerSummaryRows(rows,sort){let sorted=[...rows];if(sort==='az')sorted.sort((a,b)=>a.owner.localeCompare(b.owner));else if(sort==='za')sorted.sort((a,b)=>b.owner.localeCompare(a.owner));else if(sort==='payoutLow')sorted.sort((a,b)=>a.total-b.total||a.owner.localeCompare(b.owner));else sorted.sort((a,b)=>b.total-a.total||a.owner.localeCompare(b.owner));return sorted}
function awardRow(a){return `<div class="summary-entry"><div><div class="award-title">${esc(a.type)}</div><div class="award-detail">Flight #${a.flight||''}${a.day?' · '+esc(a.day):''} · ${esc(placeLabel(a.place))} · ${esc(cleanVal(a.winner))}</div></div><div class="award-amt">${money(+a.amount||0)}</div></div>`}
function renderOwners(){document.getElementById('owners').innerHTML=`<div class="section-title">Owners</div><div class="control-stack"><div class="team-sort-label">Owner Lookup</div><select id="ownerSel" onchange="renderOwnerDetail()"><option value="">Select Owner</option>${ownerNames().map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div><div id="ownerDetail"></div><div class="owners-merged-divider"></div><div class="owner-payout-panel"><div class="section-title">Payout Summary</div><div class="owner-payout-control-note">Owner payout totals include Flight Winner and Day Money entries.</div><div class="control-stack"><div class="team-sort-label">Sort Owners</div><select id="ownerPayoutSort" onchange="renderOwnerPayoutSummary()"><option value="az">A-Z</option><option value="za">Z-A</option><option value="payoutHigh" selected>Payout High → Low</option><option value="payoutLow">Payout Low → High</option></select></div><div id="ownerPayoutCount" class="owner-summary-count"></div><div id="ownersPayoutList" class="summary-list"></div></div>`;renderOwnerPayoutSummary()}
function renderOwnerDetail(){let owner=document.getElementById('ownerSel').value;let panel=document.querySelector('.owner-payout-panel'),divider=document.querySelector('.owners-merged-divider');if(!owner){document.getElementById('ownerDetail').innerHTML='';if(panel)panel.style.display='block';if(divider)divider.style.display='block';renderOwnerPayoutSummary();return}if(panel)panel.style.display='none';if(divider)divider.style.display='none';let rows=ownerTeams(owner),total=rows.reduce((s,r)=>s+r.awards.reduce((x,a)=>x+(+a.amount||0),0),0),bidTotal=rows.reduce((s,r)=>s+(+r.bid||0),0),flight=rows.reduce((s,r)=>s+r.awards.filter(a=>a.type==='Flight Winner').reduce((x,a)=>x+(+a.amount||0),0),0),day=rows.reduce((s,r)=>s+r.awards.filter(a=>a.type==='Day Money').reduce((x,a)=>x+(+a.amount||0),0),0);document.getElementById('ownerDetail').innerHTML=`<div class="owner-summary"><div>Owner Payout Summary</div><span class="big">${money(total)}</span><div class="owner-bid-line"><span class="owner-bid-label">Total Bid Amount</span><span class="owner-bid-val">${money(bidTotal)}</span></div><div class="owner-payout-line">Flight Winner ${money(flight)} · Day Money ${money(day)}</div></div><div class="owner-list">${rows.map(r=>`<div class="owner-team-card"><div class="team-meta"><span>Flight #${r.flight}</span><span>Team ${r.team}</span></div><div class="member">${esc(r.member)}</div><div class="guest">${esc(r.guest)}</div><div class="guest">Team Bid ${money(+r.bid||0)}</div>${r.awards.length?r.awards.map(awardRow).join(''):'<div class="winner-card"><div class="guest">No payout listed for this team.</div></div>'}</div>`).join('')}</div>`}
function renderOwnerPayoutSummary(){let sort=document.getElementById('ownerPayoutSort')?.value||'payoutHigh';let rows=sortOwnerSummaryRows(ownerSummaryRows(),sort);let grand=rows.reduce((s,r)=>s+r.total,0),grandBid=rows.reduce((s,r)=>s+(+r.bidTotal||0),0),count=rows.filter(r=>r.total>0).length;let countEl=document.getElementById('ownerPayoutCount');if(countEl)countEl.textContent=`${count} owners with payouts · ${money(grand)} total shown · ${money(grandBid)} total bids`;let list=document.getElementById('ownersPayoutList');if(list)list.innerHTML=rows.map((r,i)=>`<div class="summary-card ${r.total>0?'has':''}"><div class="summary-top"><div><div class="summary-name">${sort==='payoutHigh'&&r.total>0?'#'+(i+1)+' ':''}${esc(r.owner)}</div><div class="guest">${r.teamCount} teams · ${r.entries.length} payout entries</div></div><div class="summary-total">${money(r.total)}</div></div><div class="summary-break"><div class="mini bid-total-mini"><div class="mini-label bid-total-label">Total Bid Amount</div><div class="mini-val bid-total-val">${money(+r.bidTotal||0)}</div></div><div class="mini"><div class="mini-label">Flight Winner</div><div class="mini-val">${money(+r.flight||0)}</div></div><div class="mini"><div class="mini-label">Day Money</div><div class="mini-val">${money(+r.day||0)}</div></div></div>${r.entries.length?r.entries.map(awardRow).join(''):'<div class="guest">No payout listed.</div>'}</div>`).join('')}


renderCurrentScreen();
</script>
</body>
